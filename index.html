<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#111111">
  <title>Ofertas da Semana</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F3F4F6;
    }
    #app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #encarte-img {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: none;
      touch-action: pinch-zoom pan-x pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    #sem-promocao {
      display: none;
      text-align: center;
      padding: 32px 24px;
      max-width: 380px;
    }
    #sem-promocao .icone { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.8; }
    #sem-promocao h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: #FFFFFF; }
    #sem-promocao p { font-size: 0.95rem; line-height: 1.5; color: #9CA3AF; }
  </style>
</head>
<body>
  <div id="app">
    <img id="encarte-img" alt="Encarte de Promoções">
    <div id="sem-promocao">
      <div class="icone">🛍️</div>
      <h1>Sem promoções no momento</h1>
      <p>Tente amanhã ou nos próximos dias. Aproveite suas compras!</p>
    </div>
  </div>

  <script>
    const img = document.getElementById('encarte-img');
    const aviso = document.getElementById('sem-promocao');

    // Timestamp na URL: força sempre a versão mais recente do encarte
    img.onload = function () {
      img.style.display = 'block';
      aviso.style.display = 'none';
    };
    img.onerror = function () {
      img.style.display = 'none';
      aviso.style.display = 'block';
    };
    img.src = 'encartes/encarte.jpg?v=' + Date.now();
  </script>
</body>
</html>
